# CI -- the offline (.venv) half of scripts/run_tests.sh + the dashboard
# drift check.
#
# Written 2026-07-10; rewritten 2026-07-20 for the publish push. Runs on the
# first push once the GitHub remote exists.
#
# WHAT THIS RUNS (mirrors run_tests.sh stages 1, 3 and 4 -- keep in sync):
#   1. The main offline suite under .venv:  pytest tests/ flight/tests/
#   2. The project-state drift check:       python3 scripts/render_dashboard.py --check
#      (stdlib-only; fails if docs/dashboard.html drifted from project_state.json,
#      or if a VISIBLE hand-authored dashboard number has no verbatim source in
#      the contract -- the review-2 number-traceability guard)
#   3. The uncovered --self-test entry points (run_tests.sh stage 4): field_score,
#      seeker_loop, parse_flight_log, and ALL THREE selftest.sh packs
#      (scripts/field, configs/target_kakute, scripts/pi_setup) -- before
#      2026-07-25 only 1 of 29 self-tests was reachable from CI (review-2
#      "green != ran" finding). pyulog+pymavlink are declared in requirements.txt
#      (NOT pip'd inline here any more) so field_score's ULog/.BIN self-test cases
#      RUN instead of self-skipping.
#
# WHAT THIS DELIBERATELY SKIPS -- the .venv-seeker ONNX-parity stage
# (run_tests.sh stage 2): those tests `pytest.importorskip("onnxruntime")`
# AND need cached eval frames + detector weights that are gitignored
# (scripts/seeker/weights/, scripts/seeker/eval_out/ -- see
# docs/license_notice_weights.md for why the weights are never committed).
# On a clean runner they would skip themselves even with onnxruntime
# installed, so building the second venv buys zero coverage here and adds a
# wheel-pinning fragility surface. The parity tests remain covered locally
# by `scripts/run_tests.sh` (which fails loudly if .venv-seeker is absent).
# We can't just invoke run_tests.sh unmodified for that same reason -- it
# treats a missing .venv-seeker as a failure by design.
#
# THE ONE NON-OBVIOUS DEPENDENCY: the suite is sim-free (nothing boots
# Gazebo/PX4, no display), but about a dozen test files pull in gz python
# bindings at import time. Most import scripts/m4_intercept.py at module scope
# (it does `from gz.transport13 import Node` unconditionally) and
# tests/test_target_orientation.py exec-loads scripts/m4_target_mover.py, whose
# gz imports are also module-top-level.
#
# SINCE 2026-09-16 THAT IS NO LONGER A CI PROBLEM: the repo-root conftest.py
# installs a stub import finder for gz.*/mavsdk.* when -- and only when -- the
# real packages are absent, before pytest collects anything. Those files import
# and run fine without the bindings, so the fallback --ignore list below is down
# to ONE file: tests/test_inert_flag_guards.py, which launches m4_intercept.py in
# a SUBPROCESS (a child interpreter loads no conftest, so the real import runs).
#
# THE RUN-TIME HALF IS WHY THE GUARD MEASURES BOTH (added 2026-09-09): a file can
# COLLECT clean without gz and then fail when run, which once turned this stage
# red while the guard stayed green. tests/test_ci_gz_deselect_list.py measures
# collection errors UNION run-time gz failures; see that test's docstring.
#
# THIS LIST IS MACHINE-CHECKED, not maintained by hand:
# tests/test_ci_gz_deselect_list.py re-collects the whole suite in a subprocess
# with `gz` blocked and asserts the erroring files are EXACTLY this set. It was
# written because the hand-maintained list had already rotted three files' worth
# in one day (test_solve_intercept_time, test_dash_clock, test_terminal_coast_latch
# all landed 2026-07-25 unlisted). The failure mode is why it matters: an unlisted
# file is a pytest COLLECTION ERROR, which interrupts the ENTIRE stage rather than
# skipping one file -- and the fallback only fires when the OSRF apt step is
# already broken, i.e. exactly when CI most needs to still work.
# The bindings are NOT pip-installable (repo's requirements.txt says so);
# they come from the Gazebo Harmonic apt repo. We install just the two
# python binding packages (no rendering/GUI meta-package) and expose them
# to .venv via --system-site-packages, the same mechanism the local .venv
# uses. FALLBACK, so CI stays green if the OSRF apt step ever breaks on a
# runner image drift: if the bindings don't import, the conftest stub carries
# every import-time user of them and the single subprocess-based file is
# deselected -- it holds CLI-guard unit tests; nothing skipped that way
# touches a sim.
# tests/test_ci_gz_deselect_list.py MACHINE-CHECKS that this list covers every
# gz-importing test file, so the sync note above is data, not a promise.
#
# Pinning: Python deps are pinned in requirements.txt; ubuntu-24.04 is
# pinned (not ubuntu-latest) because the OSRF "noble" apt line and the
# system python3.12 assumption below depend on it.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT actions/setup-python: the Gazebo apt packages below
      # install python3-gz-transport13 against the SYSTEM python3 (24.04
      # ships 3.12, matching this repo's dev venvs). A separately
      # provisioned interpreter would not see the apt-installed bindings.
      - name: Check system Python version
        run: python3 --version

      - name: Install Gazebo Harmonic python bindings (apt, no GUI/render; best-effort)
        run: |
          set -x
          if sudo curl -sSL https://packages.osrfoundation.org/gazebo.gpg \
               -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg \
             && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/gazebo-stable.list > /dev/null \
             && sudo apt-get update \
             && sudo apt-get install -y python3-gz-transport13 python3-gz-msgs10; then
            echo "gz bindings installed"
          else
            echo "::warning::OSRF apt step failed -- gz-importing test files will be deselected"
          fi

      - name: Create .venv (main suite) and install pinned deps
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # NOTHING is pip-installed here that requirements.txt does not declare.
          # Until 2026-07-25 this step carried an inline
          #   pip install pyulog==1.2.3 pymavlink==2.4.49
          # under a comment reading "local-.venv extras not in requirements.txt".
          # That was dependency drift with a second source of truth: `pip install
          # -r requirements.txt` alone did NOT reproduce the suite. Both pins now
          # live in requirements.txt; if a dep is missing, the fix goes THERE.

      - name: Run the offline suite (run_tests.sh stage 1, .venv)
        run: |
          # Mirror of run_tests.sh stage 1; the gz-fallback deselect list is
          # the ten gz-at-import-time files (see the header comment; the list
          # is machine-checked by tests/test_ci_gz_deselect_list.py).
          if .venv/bin/python -c "import gz.transport13, gz.msgs10" 2>/dev/null; then
            .venv/bin/python -m pytest tests/ flight/tests/ -v
          else
            echo "::warning::gz bindings unavailable -- deselecting the 1 subprocess-based test file"
            .venv/bin/python -m pytest tests/ flight/tests/ -v \
              --ignore=tests/test_inert_flag_guards.py
          # SIX MORE ENTRIES REMOVED 2026-09-16 -- the list is now ONE file.
          # The gz/mavsdk stub import finder moved out of tests/test_rescore_cpa.py
          # (where it was installed at module scope, i.e. effective only for test
          # files collected LATER in the alphabet) into the repo-root conftest.py,
          # which pytest imports before collecting anything. Every module-scope
          # `from gz.transport13 import Node` is therefore satisfiable without the
          # bindings, and nothing in this branch errors at COLLECTION any more.
          # Measured 2026-09-16 on a from-scratch venv built WITHOUT
          # --system-site-packages (so gz is genuinely absent), pip install
          # -r requirements.txt, on a clean `git archive HEAD` tree:
          #   old 7-entry list, before the conftest:  884 passed,  9 skipped
          #   this 1-entry list, after:               962 passed,  8 skipped
          #   no --ignore at all:            963 passed, 10 FAILED
          # and all 10 of those failures are tests/test_inert_flag_guards.py.
          #
          # WHY THAT ONE FILE STAYS: it runs `python scripts/m4_intercept.py ...`
          # as a SUBPROCESS and asserts on the exit code. A child interpreter
          # never loads our conftest, so the real gz import runs and the process
          # dies with ModuleNotFoundError. Dropping it puts 10 real failures back.
          #
          # PRIOR CHAPTER, kept because it explains the shape of this guard:
          # five entries came off on 2026-09-10 (review finding H3), recovering
          # 106 tests (772 -> 878). test_rescore_cpa.py had never been
          # gz-dependent; it was listed because the measuring shim in
          # tests/test_ci_gz_deselect_list.py RAISED from sys.meta_path[0], which
          # pre-empts an appended stub finder -- and the anti-stale test judged
          # staleness with that same shim, so it could never report the shim as
          # the cause (the shared-instrument failure mode).
          #
          # THIS LIST REMAINS MACHINE-CHECKED by tests/test_ci_gz_deselect_list.py,
          # in both directions: a missing entry fails, and a STALE entry fails too
          # (which is what will flag it if the conftest is ever removed or a file
          # starts reaching gz another way).
          fi

      # WHY `if: ${{ !cancelled() }}` ON THE REMAINING STAGES (audit fix,
      # 2026-07-25): by default a step only runs if every earlier step
      # SUCCEEDED. Stage 1 has failed on all 73 runs since the first push, so
      # stages 3 and 4 below had NEVER ONCE EXECUTED -- a red stage-1 was
      # silently hiding the drift check and the whole self-test gate, and we
      # had no idea whether they passed. Now a stage-1 failure can never again
      # mask them. `!cancelled()` rather than `always()` so a manually
      # cancelled run stops instead of grinding on.
      #
      # THE JOB STILL FAILS RED IF ANY STAGE FAILS: `if:` only controls whether
      # a step RUNS, never how its exit code is aggregated (that would be
      # `continue-on-error: true`, which we deliberately do NOT use anywhere).
      # Green here means all four stages ran AND all four passed.
      - name: Project-state dashboard drift check (run_tests.sh stage 3)
        if: ${{ !cancelled() }}
        run: python3 scripts/render_dashboard.py --check

      - name: Uncovered --self-test entry points (run_tests.sh stage 4)
        if: ${{ !cancelled() }}
        # Each must exit 0. A self-test that cannot run is a FAILURE here, not
        # a skip (docs/error_handling_policy.md: green means ran).
        #
        # ALL THREE selftest.sh PACKS are wired (audit fix, 2026-07-25). Before
        # it, `git ls-files | grep selftest.sh` returned three packs and only
        # scripts/field was gated here or in run_tests.sh -- which is exactly
        # how the stale tripod mission geometry survived in the ungated
        # configs/target_kakute pack. Both additions are stdlib-only, offline,
        # no hardware and no sim (verified locally 2026-07-25, each exit 0).
        run: |
          set -e
          .venv/bin/python "$PWD/scripts/field_score.py" --self-test
          .venv/bin/python "$PWD/flight/deploy/seeker_loop.py" --self-test
          .venv/bin/python "$PWD/scripts/field/parse_flight_log.py" --self-test
          FIELD_LOG_ROOT="$(mktemp -d)" bash "$PWD/scripts/field/selftest.sh"
          bash "$PWD/configs/target_kakute/selftest.sh"
          bash "$PWD/scripts/pi_setup/selftest.sh"
