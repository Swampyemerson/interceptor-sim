<text class="sx-wl" x="52" y="616"><tspan class="sx-wn">benchPower</tspan><tspan class="sx-wm">  psu.usbC → pi.pwrIn</tspan><tspan class="sx-wt">  : DCPowerLink</tspan><tspan class="sx-ws sx-s-verified">  VERIFIED (skr-07)</tspan></text>
<text class="sx-wd" x="52" y="630">USB-C PD — bench rail -- OR the power bank, never both</text>
<g class="sx-pill sx-c-power sx-s-planned"><rect x="20" y="634" width="22" height="16" rx="8"/><text x="31" y="646">2</text></g>
<text class="sx-wl" x="52" y="646"><tspan class="sx-wn">fieldPower</tspan><tspan class="sx-wm">  powerBank.usbC → pi.pwrIn</tspan><tspan class="sx-wt">  : DCPowerLink</tspan><tspan class="sx-ws sx-s-planned">  PLANNED</tspan></text>
<text class="sx-wd" x="52" y="660">USB-C PD &gt;= 27 W — field rail -- the wall PSU is useless outdoors</text>
<g class="sx-pill sx-c-power sx-s-verified"><rect x="20" y="664" width="22" height="16" rx="8"/><text x="31" y="676">3</text></g>
<text class="sx-wl" x="52" y="676"><tspan class="sx-wn">fan</tspan><tspan class="sx-wm">  pi.fanHeader → cooler.header</tspan><tspan class="sx-wt">  : FanLink</tspan><tspan class="sx-ws sx-s-verified">  VERIFIED (skr-07)</tspan></text>
<text class="sx-wd" x="52" y="690">4-pin fan header — 750 s soaks, no throttling</text>
<g class="sx-pill sx-c-data sx-s-verified"><rect x="20" y="694" width="22" height="16" rx="8"/><text x="31" y="706">4</text></g>
<text class="sx-wl" x="52" y="706"><tspan class="sx-wn">cameraRibbon</tspan><tspan class="sx-wm">  camera.csi → pi.cam0</tspan><tspan class="sx-wt">  : CSI2Link</tspan><tspan class="sx-ws sx-s-verified">  VERIFIED (skr-02)</tspan></text>
<text class="sx-wd" x="52" y="720">22-to-15-pin CSI ribbon — CAM/DISP0 (not the default port 1) · cable: Wonrabai 22-to-15-pin CSI cable</text>
<g class="sx-pill sx-c-data sx-s-verified"><rect x="20" y="724" width="22" height="16" rx="8"/><text x="31" y="736">5</text></g>
