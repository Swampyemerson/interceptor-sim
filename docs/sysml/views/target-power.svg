<text class="sx-wd" x="52" y="668">8-pin stack harness — VBAT + current sense up; DShot600 M1-M4 down</text>
<g class="sx-pill sx-c-power sx-s-planned"><rect x="20" y="672" width="22" height="16" rx="8"/><text x="31" y="684">4</text></g>
