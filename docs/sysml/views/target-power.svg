<text class="sx-wd" x="52" y="698">6-wire harness to pads — UART3 (SERIAL3_PROTOCOL=5) + I2C compass + 5 V</text>
<g class="sx-pill sx-c-power sx-s-planned"><rect x="20" y="702" width="22" height="16" rx="8"/><text x="31" y="714">5</text></g>
