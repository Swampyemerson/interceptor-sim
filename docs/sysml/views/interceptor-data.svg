<text class="sx-h" x="20" y="814">WIRE LIST — every connection in this view</text>
<g class="sx-pill sx-c-data sx-s-wired"><rect x="20" y="822" width="22" height="16" rx="8"/><text x="31" y="834">1</text></g>
<text class="sx-wl" x="52" y="834"><tspan class="sx-wn">fcPower</tspan><tspan class="sx-wm">  pm02.fcLead → fc.power1</tspan><tspan class="sx-wt">  : PowerModuleLink</tspan><tspan class="sx-ws sx-s-wired">  WIRED</tspan></text>
<text class="sx-wd" x="52" y="848">6-pin JST-GH — 5.2 V + analog V/I sense to POWER1</text>
<g class="sx-pill sx-c-data sx-s-wired"><rect x="20" y="852" width="22" height="16" rx="8"/><text x="31" y="864">2</text></g>
<text class="sx-wl" x="52" y="864"><tspan class="sx-wn">escSignal</tspan><tspan class="sx-wm">  fc.mainOut → esc.signal</tspan><tspan class="sx-wt">  : DShotLink</tspan><tspan class="sx-ws sx-s-wired">  WIRED</tspan></text>
<text class="sx-wd" x="52" y="878">signal lead (pin map TBD) — DShot600 M1-M4 + GND; contract says JST-SH 8-pin, wiring card says MAIN is 3-pin S/+/- -- check at afr-01</text>
<g class="sx-pill sx-c-data sx-s-verified"><rect x="20" y="882" width="22" height="16" rx="8"/><text x="31" y="894">3</text></g>
<text class="sx-wl" x="52" y="894"><tspan class="sx-wn">gpsCable</tspan><tspan class="sx-wm">  fc.gps1 → gps.fcConn</tspan><tspan class="sx-wt">  : GPSCableLink</tspan><tspan class="sx-ws sx-s-verified">  VERIFIED (brn-02)</tspan></text>
<text class="sx-wd" x="52" y="908">10-pin JST-GH — GPS UART (UBX 10 Hz) + IST8310 compass on GPS1&#x27;s own I2C + 5 V</text>
<g class="sx-pill sx-c-data sx-s-verified"><rect x="20" y="912" width="22" height="16" rx="8"/><text x="31" y="924">4</text></g>
<text class="sx-wl" x="52" y="924"><tspan class="sx-wn">companion</tspan><tspan class="sx-wm">  fc.telem2 → pi.gpioUart</tspan><tspan class="sx-wt">  : UARTLink</tspan><tspan class="sx-ws sx-s-verified">  VERIFIED (brn-03, brn-05)</tspan></text>
<text class="sx-wd" x="52" y="938">JST-GH 6-pin -&gt; DuPont (3 wires) — MAVLink 921600: pin2 TX -&gt; GPIO15 (pin 10), pin3 RX &lt;- GPIO14 (pin 8), pin6 GND -&gt; pin 6; pin1 +5 V NOT connected · cable: Pi-to-TELEM2 UART jumper leads</text>
<g class="sx-pill sx-c-data sx-s-wired"><rect x="20" y="942" width="22" height="16" rx="8"/><text x="31" y="954">5</text></g>
<text class="sx-wl" x="52" y="954"><tspan class="sx-wn">rcSbus</tspan><tspan class="sx-wm">  fc.rcIn → rx.fcConn</tspan><tspan class="sx-wt">  : RCInLink</tspan><tspan class="sx-ws sx-s-wired">  WIRED</tspan></text>
<text class="sx-wd" x="52" y="968">RC IN socket — SBUS (ELRS flashed to SBUS out) + 5 V; kill/arm only</text>
<g class="sx-pill sx-c-data sx-s-wired"><rect x="20" y="972" width="22" height="16" rx="8"/><text x="31" y="984">6</text></g>
<text class="sx-wl" x="52" y="984"><tspan class="sx-wn">buzzer</tspan><tspan class="sx-wm">  fc.buzzerTap → finder.fcConn</tspan><tspan class="sx-wt">  : BuzzerLink</tspan><tspan class="sx-ws sx-s-wired">  WIRED</tspan></text>
<text class="sx-wd" x="52" y="998">TBD — drive pin UNRESOLVED -- the 6C Mini has no buzzer pad</text>
<g class="sx-pill sx-c-data sx-s-wired"><rect x="20" y="1002" width="22" height="16" rx="8"/><text x="31" y="1014">7</text></g>
<text class="sx-wl" x="52" y="1014"><tspan class="sx-wn">ulogCard</tspan><tspan class="sx-wm">  fc.sdSlot → fcSd.contacts</tspan><tspan class="sx-wt">  : SDCardLink</tspan><tspan class="sx-ws sx-s-wired">  WIRED</tspan></text>
<text class="sx-wd" x="52" y="1028">onboard microSD slot — PX4 ULogs</text>
<g class="sx-pill sx-c-data sx-s-verified"><rect x="20" y="1032" width="22" height="16" rx="8"/><text x="31" y="1044">8</text></g>
